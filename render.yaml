# Prepared only. Importing this Blueprint would create a paid public service;
# do not do that without Shade's explicit approval. The analysis route starts
# disabled even if the service is created.
services:
  - type: web
    name: fineprint-api
    runtime: python
    plan: 0.5c-512mb
    region: virginia
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /health
    autoDeployTrigger: "off"
    numInstances: 1
    disk:
      name: fineprint-quota
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: FINEPRINT_MODEL
        value: gpt-5.6-terra
      - key: FINEPRINT_FALLBACK_MODEL
        value: gpt-5.6-sol
      - key: FINEPRINT_REASONING_EFFORT
        value: medium
      - key: FINEPRINT_PUBLIC_MODE
        value: "true"
      - key: FINEPRINT_PUBLIC_API_ENABLED
        value: "false"
      - key: FINEPRINT_TRUST_PROXY_HEADERS
        value: "true"
      - key: FINEPRINT_RATE_LIMIT_REQUESTS
        value: "3"
      - key: FINEPRINT_RATE_LIMIT_WINDOW_SECONDS
        value: "3600"
      - key: FINEPRINT_DAILY_ANALYSIS_CAP
        value: "25"
      - key: FINEPRINT_IP_HASH_SECRET
        generateValue: true
      - key: FINEPRINT_QUOTA_DB
        value: /var/data/fineprint-quota.sqlite3
